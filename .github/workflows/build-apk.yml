name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node Dependencies
        run: npm install

      - name: 4. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 7. Sync Capacitor Android
        run: npx cap sync android

      - name: 8. Ensure Gradle Wrapper
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2.1
          fi
          chmod +x gradlew

      - name: 9. Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 10. Upload APK to Artifacts (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: Ramkumar-Bhandar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 60
